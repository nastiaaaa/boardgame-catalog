<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог настільних ігор</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Каталог настільних ігор</h1>
        <nav>
            <ul>
                <li><a href="#strategy">Стратегічні</a></li>
                <li><a href="#family">Сімейні</a></li>
                <li><a href="#card">Карткові</a></li>
                <li><a href="#kids">Для дітей</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="filters">
            <h2>Фільтри</h2>
            <form action="#">
                <label for="search">Пошук ігор:</label>
                <input type="text" id="search" placeholder="Введіть назву гри" name="game">
                <button type="submit" class="btn-filter">Шукати</button>
            </form>
        </section>

        <section id="games-section">
            <h2>Ігри</h2>
            <p id="games-count"></p> 
            
            <div id="games-list">
                <article class="game-card">
                    <h3>AZUL 1</h3>
                    <p class="player-badge">2-4 гравці</p>
                </article>
                <article class="game-card">
                    <h3>UNO</h3>
                    <p class="player-badge">2-10 гравців</p>
                </article>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Каталог настільних ігор.</p>
        <p>Автор каталогу: студентка групи ІП-о51 Самчинська Анастасія</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
