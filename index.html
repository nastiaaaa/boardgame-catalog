<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог настільних ігор</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Fredoka:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1>Каталог настільних ігор</h1>
        <nav>
            <ul>
                <li><a href="#strategy">Стратегічні</a></li>
                <li><a href="#family">Сімейні</a></li>
                <li><a href="#card">Карткові</a></li>
                <li><a href="#kids">Для дітей</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="filters">
            <h2>Фільтри</h2>
            <form action="#" id="filter-form">
                <label for="player-filter">Кількість гравців:</label>
                <select id="player-filter" name="players">
                    <option value="all">Всі ігри</option>
                    <option value="1">1 гравець</option>
                    <option value="2">2 гравці</option>
                    <option value="3">3 гравці</option>
                    <option value="4">4 гравці</option>
                    <option value="5">5+ гравців</option>
                </select>
            </form>
        </section>

        <section id="add-game-section">
            <h2>Додати нову гру</h2>
            <form id="add-game-form">
                <input type="text" id="title" placeholder="Назва гри" required>
                
                <input type="number" id="minPlayers" placeholder="Мін. гравців" min="1" required>
                
                <input type="number" id="maxPlayers" placeholder="Макс. гравців" min="1" required>
                
                <select id="genre" required>
                    <option value="" disabled selected>Оберіть жанр</option>
                    <option value="Стратегічна">Стратегічна</option>
                    <option value="Сімейна">Сімейна</option>
                    <option value="Карткова">Карткова</option>
                    <option value="Дитяча">Дитяча</option>
                    <option value="Паті-гейм">Паті-гейм</option>
                </select>
                
                <button type="submit" class="btn-filter">Додати</button>
            </form>
            <p id="error-message" style="color: #ff3333; font-weight: bold; display: none; margin-top: 10px;"></p>
        </section>

        <section id="games-section">
            <h2>Ігри</h2>
            <p id="games-count"></p> 
            
            <div id="games-list">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Каталог настільних ігор.</p>
        <p>Автор каталогу: студентка групи ІП-о51 Самчинська Анастасія</p>
    </footer>
    <script src="js/app.js"></script>
</body>
</html>
